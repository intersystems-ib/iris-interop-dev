# CSP config file

CSPModulePath "${ISC_PACKAGE_INSTALLDIR}/bin/"
CSPConfigPath "${ISC_PACKAGE_INSTALLDIR}/bin/"

<Location "/csp">
    CSP On
    SetHandler csp-handler-sa
</Location>

<Location "/api">
    CSP On
    SetHandler csp-handler-sa
</Location>

<Location "/isc">
    CSP On
    SetHandler csp-handler-sa
</Location>

<Location "/terminal">
    CSP On
    SetHandler csp-handler-sa
</Location>

<Location "/terminalsocket">
    CSP On
    SetHandler csp-handler-sa
</Location>

<Location "/csp/bin/Systems/">
    SetHandler csp-handler-sa
</Location>
<Location "/csp/bin/RunTime/">
    SetHandler csp-handler-sa
</Location>

<Directory "${ISC_PACKAGE_INSTALLDIR}/bin/">
    AllowOverride None
    Options None
    Require all granted
    <FilesMatch "\.(log|ini|pid|exe)$">
         Require all denied
    </FilesMatch>
</Directory>

# Redirect Help links
Redirect /csp/docbook/ http://docs.intersystems.com/irislatest/csp/docbook/
