[APP_PATH:/api]
Default_Server=LOCAL

[APP_PATH:/isc]
Default_Server=LOCAL

[APP_PATH:/terminal]
Default_Server=LOCAL

[APP_PATH:/terminalsocket]
Default_Server=LOCAL
