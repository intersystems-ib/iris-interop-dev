name: release

# Build the iris-interop-dev binary for the workshop platforms on a v* tag and publish a (private)
# GitHub Release. The Windows .exe is the artifact the instructor bakes into the VM. Windows builds
# natively on a Windows runner (no cross-compile). Trigger: push a tag like v0.7.0-interop, or run
# manually (workflow_dispatch) to get the artifacts without cutting a Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: iris-interop-dev-windows-x64.exe
            bin: iris-interop-dev.exe
            arch: x86_64
          # macos-14 was DEPRECATED by actions/runner-images (#13518). A deprecated image is
          # removed on a schedule nothing here controls, and the first symptom would be a tag
          # push that cannot build the only macOS asset. macos-15 is the current arm64 label.
          - os: macos-15
            target: aarch64-apple-darwin
            asset: iris-interop-dev-macos-arm64
            bin: iris-interop-dev
            arch: arm64
          # Intel Macs. Every other asset here was already x64; macOS was the one platform
          # published for arm64 ONLY, so an Intel Mac had no asset at all — and the arm64 file
          # downloads and hash-verifies before failing at exec, which reads as a broken release
          # rather than a missing build.
          #
          # Built on an Intel RUNNER, not cross-compiled from arm64, so the `--version` guard
          # below still executes the artifact it is vouching for. (Cross-compiling would need
          # Rosetta on the runner just to run that guard, or the guard would have to be skipped
          # for the one asset whose architecture is least verifiable.) macos-13 was the old
          # Intel label and no longer exists; macos-15-intel is its replacement.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: iris-interop-dev-macos-x64
            bin: iris-interop-dev
            arch: x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: iris-interop-dev-linux-x64
            bin: iris-interop-dev
            arch: x86_64
          # #174: the gnu asset above links GLIBC_2.39 (ubuntu-latest), so it downloads,
          # hash-verifies and then dies at exec on AL2023 / RHEL 8-9 / Debian 12. A static
          # musl build has no libc floor and removes the class. Additive — the gnu asset
          # keeps its name and bytes, so existing pins are unaffected.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: iris-interop-dev-linux-x64-musl
            bin: iris-interop-dev
            arch: x86_64
            zig: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Provenance guard (issue #3): a release where the tag name, Cargo.toml and the
      # binary's --version disagree must never publish. Check tag vs Cargo.toml before
      # spending a build; the built binary is checked in "guard: binary --version" below.
      - name: "guard: tag matches Cargo.toml version"
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"; tag_version="${tag_version%%-*}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "tag=$GITHUB_REF_NAME → $tag_version, Cargo.toml=$cargo_version"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME declares $tag_version but Cargo.toml says $cargo_version — refusing to release"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # musl is cross-compiled with zig; the other three are native to their runner.
      - uses: mlugg/setup-zig@v2
        if: matrix.zig
      - name: install cargo-zigbuild
        if: matrix.zig
        run: cargo install cargo-zigbuild
      - name: build (release)
        if: ${{ !matrix.zig }}
        run: cargo build --release -p iris-agentic-dev --target ${{ matrix.target }}
      - name: build (release, zigbuild)
        if: ${{ matrix.zig }}
        run: cargo zigbuild --release -p iris-agentic-dev --target ${{ matrix.target }}
      - name: stage binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.asset }}"
      # #174: this asset exists ONLY because it is static. If it ever acquires a dynamic
      # libc dependency it is worthless and must not publish — so this FAILS, it does not warn.
      - name: "guard: musl asset is statically linked"
        if: matrix.zig
        shell: bash
        run: |
          out=$(ldd "${{ matrix.asset }}" 2>&1 || true)
          echo "$out"
          if ! grep -q "not a dynamic executable\|statically linked" <<<"$out"; then
            echo "::error::${{ matrix.asset }} is NOT static — refusing to publish a musl asset with a libc floor"
            exit 1
          fi
          echo "static confirmed"
      # Every asset name states an architecture and nothing checked it. The matrix is the only
      # thing tying a name to a --target, so a changed runner label or a copied row publishes a
      # binary that downloads, hash-verifies and dies at exec — #174's failure one layer up,
      # with the instruction set as the floor instead of GLIBC. The matcher is a script so that
      # scripts/test-verify-asset-arch.sh can exercise it against recorded `file` output from
      # all three platforms, including the empty and unrecognised cases.
      - name: "guard: the asset is built for the architecture its name promises"
        shell: bash
        run: bash scripts/verify-asset-arch.sh "${{ matrix.arch }}" "$(file -b "${{ matrix.asset }}")"
      - name: ad-hoc codesign (macOS — avoids Gatekeeper quarantine hang)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - "${{ matrix.asset }}"
      # Every target except musl is native to its runner, so the staged asset is executable here —
      # including the two macOS assets, which is why each is built on a runner of its own
      # architecture rather than cross-compiled from the other.
      - name: "guard: binary --version matches Cargo.toml"
        shell: bash
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          bin_version=$("./${{ matrix.asset }}" --version | awk '{print $NF}')
          echo "binary=$bin_version, Cargo.toml=$cargo_version"
          if [ "$bin_version" != "$cargo_version" ]; then
            echo "::error::built binary reports $bin_version but Cargo.toml says $cargo_version — refusing to release"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # #224: this job did NOT check out the repo. It did not need to while the only publishing
      # step was the action itself, but the asset guard below runs a script from scripts/, so the
      # tree has to be here. Placed BEFORE download-artifact: checkout cleans the workspace, and
      # running it after would delete the artifacts it just downloaded.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # #224: the release is created WITHOUT assets here, and each asset is uploaded on its own
      # in the next step. Publishing all four through this action's `files:` glob failed twice
      # for v0.20.0-interop with one unattributable "Error saving asset" — no asset name, no
      # HTTP status, a single line for four parallel operations — leaving a DRAFT release with
      # ZERO assets while all four build jobs reported success. Uploading the identical bytes to
      # the identical release sequentially succeeded on the first attempt, every time.
      # Concurrency was the only variable that changed.
      #
      # Also un-floated: `@v3` would silently pick up a new upload implementation, and this step
      # is the only thing that publishes anything. (A commit SHA is stricter still; no other
      # action in this repo is SHA-pinned, so this stays a tag to match.)
      - uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          body: |
            Streamlined **iris-interop-dev** MCP server (interop-focused fork of iris-agentic-dev).

            | platform | asset |
            |---|---|
            | macOS, Apple Silicon | `iris-interop-dev-macos-arm64` |
            | macOS, Intel | `iris-interop-dev-macos-x64` |
            | Linux x64 | `iris-interop-dev-linux-x64` |
            | Linux x64, older glibc (AL2023, RHEL 8-9, Debian 12) | `iris-interop-dev-linux-x64-musl` |
            | Windows x64 | `iris-interop-dev-windows-x64.exe` |

            **Workshop VM (Windows):** download `iris-interop-dev-windows-x64.exe`, place it at
            `C:\iris-interop-dev\iris-interop-dev.exe`, then register the MCP:
            ```
            claude mcp add --scope user iris-interop-dev --env IRIS_HOST=localhost --env IRIS_WEB_PORT=80 --env IRIS_WEB_PREFIX=irishealth --env IRIS_USERNAME=_SYSTEM --env IRIS_PASSWORD=SYS --env IRIS_NAMESPACE=USER -- C:/iris-interop-dev/iris-interop-dev.exe mcp
            ```
            Tool names are identical to iris-agentic-dev, so the iris-interop-skills work unchanged.

      # #224: one asset at a time. `--clobber` so a retry of a partially-published release is
      # idempotent rather than a "already exists" failure.
      - name: upload assets sequentially
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for f in dist/*; do
            name=$(basename "$f")
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$f" --clobber; then
                echo "uploaded $name (attempt $attempt)"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::failed to upload $name after 3 attempts"
                exit 1
              fi
              echo "upload of $name failed, retrying in $((attempt * 5))s"
              sleep $((attempt * 5))
            done
          done

      # #224: publication is read back, not assumed — the failure being fixed was a green run
      # with an empty release. The comparison lives in scripts/verify-release-assets.sh so it has
      # ONE implementation that scripts/test-verify-release-assets.sh can exercise (7 cases,
      # including the four-green-builds-zero-assets failure itself). The real failure only
      # reproduces on a tag push, so testing the logic is how it gets verified at all.
      - name: "guard: every staged asset is published, with bytes"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"' > published.txt
          echo "--- published assets ---"; cat published.txt
          bash scripts/verify-release-assets.sh dist published.txt

# (workflow registered under intersystems-ib/iris-interop-dev)
