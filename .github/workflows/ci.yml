name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Lets the master-only e2e-tests job be validated on a branch before merging.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # Build the binary first — mcp_handshake, plugin_dispatch_tests and test_compile_cmd
      # all spawn it, and cargo test does not build another package's bin for them.
      - run: cargo build -p iris-agentic-dev
      # THE RULE (#95): this gate runs EVERY test target the workspace declares or
      # auto-discovers, minus an explicit opt-out list. New test targets are covered
      # automatically — there is no list here to forget to update.
      #
      # The opt-out list lives in scripts/ci-test-targets.sh, one entry with one reason.
      # Today it holds exactly one target (docker_discovery_e2e). That script derives the
      # target list from `cargo metadata`, so auto-discovered targets like transport_e2e
      # — which appears in no [[test]] block — are included too.
      #
      # ADDING A TEST TARGET THAT NEEDS A LIVE IRIS? It is CI-blocking by default now.
      # Mark the individual tests `#[ignore = "requires live IRIS"]`, or, if the whole
      # target is unrunnable here, add it to EXCLUDED in that script with a reason.
      #
      # PREFER #[ignore] TO A SELF-SKIP. Two styles are in the tree and they are NOT
      # equivalent in what this gate reports:
      #   - `#[ignore]` (admin_e2e_tests, interop_e2e_tests, progressive_disclosure_integration,
      #     test_iris_test_e2e, test_live_reload_e2e, test_sql_safety_e2e, test_sql_translate_e2e)
      #     reports 46 results as `ignored` — visibly not run.
      #   - a `require_iris!`/IRIS_HOST check that prints a note and returns (test_e2e,
      #     test_scm, test_mcp_iris, test_e2e_all_tools, test_compile_cmd) reports as
      #     PASSED. About 137 of this gate's passes are green-but-vacuous for that reason.
      # The pass count therefore overstates what ran, which is the same dishonesty #87(b)
      # fixed for fail-fast. New live-IRIS tests should use #[ignore] so the count stays
      # truthful; the master-only e2e-tests job is what actually exercises them.
      #
      # #240: that last clause was only ever true of ONE target. The e2e job named two
      # targets by hand and reached 9 of the 53 `#[ignore]` tests. It now derives the SAME
      # list this gate uses and runs it with `--include-ignored`, so "`#[ignore]` means the
      # e2e job runs it" is a fact rather than an intention.
      #
      # Before this change the gate ran 11 hand-listed targets. Three targets that were in
      # no gate at all were found red or intermittently red (#90 test_search_unit,
      # #91 admin_unit_tests, test_workspace_config) — nobody saw them because nobody ran
      # them. The marginal cost of the other 32 targets is ~10s: clippy --all-targets
      # already pays the compile.
      #
      # --lib --bins: --bins is not redundant. crates/iris-agentic-dev-bin/src/cmd/plugin.rs
      # holds unit tests that no job had ever run.
      #
      # --no-fail-fast: without it a failure in an earlier --test target means the later
      # ones never execute and print nothing, which reads as "passed" (#87). Cargo still
      # exits non-zero if any target failed.
      #
      # KNOWN LOAD-SENSITIVE ASSERTIONS — wall-clock budgets, not logic. If one of these
      # is the only red, RE-RUN IT ALONE before calling it a regression:
      #   * symbols_local_tests::sc003_parse_500_lines_under_100ms (tree-sitter budget)
      #   * discovery_tests::probe_atelier_respects_timeout        (< 500ms vs 10.255.255.1)
      #
      # #200: mcp_handshake::mcp_server_startup_latency_under_100ms WAS on that list and is
      # gone. It asserted p50 < 100ms and failed ~1 run in 5. Measured: p50 16-18ms idle, but
      # 6/6 failures with 16 busy loops running — it read machine load as a regression, and
      # "re-run it alone" is the instruction that teaches everyone to re-run a red instead of
      # reading it. Replaced by initialize_does_not_block_on_discovery, which asserts the FLOOR
      # of warm samples against a 1000ms budget: still catches discovery blocking (~2.3s) and
      # does not care how busy the runner is.
      #
      # NOT a flake source any more: manifest_tests and skills_tests used to reach GitHub
      # unauthenticated (60 req/hr per IP, shared by every job on a runner, reported as a
      # 403 that reads like a permissions bug). Both are now covered offline by wiremock
      # (#87, #92); their live canaries are opt-in behind IRIS_DEV_LIVE_GITHUB and run in
      # the advisory step below. This gate makes no outbound request.
      #
      # Running it locally: use `env -u IRIS_HOST -u IRIS_CONTAINER cargo test ...`. Do NOT
      # use `IRIS_HOST= ` — src/iris/discovery.rs:149 treats a set-but-empty host as real
      # and spends 5s probing it. With IRIS_HOST exported, test_e2e and test_scm will talk
      # to your live instance and write to it.
      #
      # WHY THE TARGET LIST IS BUILT ON ITS OWN LINE, AND MUST STAY THERE:
      # `cargo test ... $(scripts/ci-test-targets.sh) ...` looks equivalent and is not.
      # Bash `set -e` — the shell Actions runs `run:` with — does NOT propagate a failed
      # command substitution sitting in argument position (`-eo pipefail` does not either;
      # both measured). The step would carry on with EMPTY args and EXIT 0. Measured in
      # this repo, that degraded command runs 2 targets (lib + bin, 408 tests) instead of
      # 45 and is fully GREEN: every test target — mcp_handshake, test_toolset,
      # plugin_dispatch_tests included — drops out of the required gate with no signal.
      # That is #95's own pathology reproduced one level up, so: keep the assignment
      # standalone. As a standalone assignment the same failure exits 1 (measured).
      # Triggers that make this matter: the script's anti-drift guard firing (its whole
      # job is to exit 1), `cargo metadata` failing, python3 missing, or the file landing
      # without its exec bit.
      #
      # `bash scripts/...` rather than `scripts/...`: the file's mode bit is then not
      # load-bearing. A checkout that loses +x gets a working gate instead of one that
      # depends on the guard above to notice `Permission denied`.
      # The per-tool validation gate ran in NO workflow — only from scripts/test-all.sh, which a
      # human has to invoke. So tools-status.json drifted to 29 entries against INTEROP_TOOLS' 31
      # and nothing said so. Same shape as the bollard guard that reported `ok` having never run:
      # a check that executes nowhere is not a check. It is read-only and takes well under a second.
      #
      # `bash scripts/...` for the same reason as below: the mode bit is then not load-bearing.
      - name: Per-tool validation gate (tools-status.json vs INTEROP_TOOLS)
        run: bash scripts/validate-tools.sh

      - name: Full offline test gate (required)
        run: |
          TARGETS=$(bash scripts/ci-test-targets.sh)
          # The script refuses to exit 0 with an empty list; this refuses to trust it.
          # A $TARGETS carrying no --test flag is precisely the silent degradation above,
          # and the glob catches empty, whitespace-only and malformed alike.
          if [[ "$TARGETS" != *--test* ]]; then
            echo "::error::scripts/ci-test-targets.sh emitted no test targets - refusing to run a degraded gate"
            exit 1
          fi
          # Unquoted on purpose: $TARGETS must word-split into the --test flags.
          # That word-splitting is the point, not an oversight:
          # shellcheck disable=SC2086
          cargo test --workspace --lib --bins $TARGETS --no-fail-fast
        env:
          RUST_LOG: warn
      # #224: the release-asset guard's logic, exercised here because the failure it catches
      # (four green build jobs, a release with zero assets) only reproduces on a tag push. 7
      # cases including a positive control, so a script that always failed could not pass them.
      # Runs in the ordinary `test` job so it cannot rot unnoticed until the next release.
      - name: "release-asset guard logic (#224)"
        run: bash scripts/test-verify-release-assets.sh
      # The workflows themselves were unlinted until now. actionlint caught 7 shellcheck
      # findings on first run, and — more usefully — it is the only thing that would have told us
      # whether a NEW workflow file is even valid before it reaches the default branch.
      # docker-discovery.yml (#225) was merged on YAML-parses-locally alone; GitHub accepting it
      # was luck confirmed after the fact rather than a check.
      #
      # Pinned to a release rather than a floating tag, for the reason #224 un-floated
      # action-gh-release: a linter that silently changes what it rejects turns an unrelated push
      # red.
      - name: lint the workflows (actionlint)
        run: |
          set -euo pipefail
          # The official binary, version-pinned, rather than a third-party wrapper action. This
          # repo just un-floated softprops/action-gh-release for supply-chain reasons (#224), and
          # adding a 51-star third-party action to lint four files would trade that back.
          VER=1.7.12
          curl -sSLo actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz"
          tar -xzf actionlint.tgz actionlint
          ./actionlint --version
          # A linter that found nothing because it linted nothing is the failure mode to avoid,
          # so the file count is asserted before trusting a clean exit.
          n=$(find .github/workflows -maxdepth 1 -name '*.yml' -type f | wc -l | tr -d ' ')
          echo "linting $n workflow file(s)"
          if [ "$n" -lt 4 ]; then
            echo "::error::expected at least 4 workflow files, found $n - actionlint would pass by linting almost nothing"
            exit 1
          fi
          ./actionlint .github/workflows/*.yml
      # Advisory: exercises the real api.github.com and raw.githubusercontent.com paths
      # with the token Actions injects (1000 req/hr per repo, not 60 per IP).
      # continue-on-error so a GitHub-side outage or limit can never redden the gate above.
      #   * manifest_tests — the version resolver against api.github.com (#87).
      #   * skills_tests   — the subscription path against raw.githubusercontent.com (#92).
      #     Retargeted: it pointed at intersystems-community/iris-vector-rag, which
      #     publishes no manifest (HTTP 404), so it had been failing-when-enabled and
      #     hidden behind a flag since v0.5.0.
      - name: Live GitHub canaries — resolver + subscription (advisory)
        continue-on-error: true
        run: |
          cargo test --no-fail-fast -p iris-agentic-dev-core \
            --test manifest_tests --test skills_tests -- --nocapture
        env:
          RUST_LOG: warn
          IRIS_DEV_LIVE_GITHUB: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  benchmark-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: Verify benchmark task YAML parses clean
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, 'benchmark/021/runner')
          from task_loader import load_tasks
          tasks = load_tasks()
          print(f'OK: {len(tasks)} tasks loaded and validated')
          "

  windows-handshake:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p iris-agentic-dev
      - name: MCP handshake smoke test on Windows
        shell: pwsh
        run: |
          $init = '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"test","version":"1"}}}'
          # Ignore exit code from iris-agentic-dev — it exits non-zero when stdin closes
          $result = $init | & "target\debug\iris-interop-dev.exe" mcp 2>$null
          $exitCode = $LASTEXITCODE
          Write-Host "Response: $result"
          Write-Host "Binary exit code: $exitCode (expected non-zero — stdin closed)"
          if ($result -match '"capabilities"') {
            Write-Host "PASS: capabilities advertised on Windows"
            exit 0
          } else {
            Write-Host "FAIL: no capabilities in response. Got: $result"
            exit 1
          }

  e2e-tests:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p iris-agentic-dev
      - name: Start IRIS container
        run: |
          # Image tag: intersystemsdc 2026.1 and latest-cd fail post-startup on GHA
          # runners — the image's own `iris-after-start` hook dies with "Cannot call
          # an iris.package wrapper ... dbapi.connect" and the entrypoint then shuts
          # IRIS down (see #44). 2025.3 is the last known-good stable tag; upstream
          # made the same switch. Community licenses expire ~150 days after image
          # publish, so if this starts failing with "Community License expired",
          # move to a newer known-good tag.
          # --shm-size/--ulimit: the community image also needs these to start
          # reliably on GitHub runners (upstream 0308344, afea706).
          docker run -d --name iris-e2e \
            -p 52773:52773 \
            --shm-size 1g \
            --ulimit nofile=65536:65536 \
            -e IRIS_PASSWORD=SYS \
            -e IRIS_USERNAME=_SYSTEM \
            intersystemsdc/iris-community:2025.3
          # Wait for container to be running, then show why if it is not
          sleep 15
          docker ps -a | grep iris-e2e
          echo "=== Early container logs ==="
          docker logs iris-e2e 2>&1 | head -40 || true
          state=$(docker inspect -f '{{.State.Status}}' iris-e2e)
          if [ "$state" != "running" ]; then
            echo "::error::IRIS container is '$state' 15s after start (exit code $(docker inspect -f '{{.State.ExitCode}}' iris-e2e))"
            echo "=== Full container logs ==="
            docker logs iris-e2e 2>&1 | tail -80
            exit 1
          fi
      - name: Wait for IRIS Atelier API to be ready (up to 7 minutes)
        run: |
          IRIS_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' iris-e2e)
          echo "IRIS container IP: $IRIS_IP"
          # Wait for IRIS process to start first
          echo "Waiting 90s for IRIS to initialize..."
          sleep 90
          # Then poll for the web server
          for i in $(seq 1 60); do
            for host in $IRIS_IP localhost; do
              status=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 \
                -u _SYSTEM:SYS "http://$host:52773/api/atelier/" 2>/dev/null || echo "000")
              if [ "$status" = "200" ] || [ "$status" = "401" ]; then
                echo "IRIS Atelier API ready at $host:52773 (HTTP $status)"
                echo "IRIS_HOST=$host" >> "$GITHUB_ENV"
                exit 0
              fi
              echo "  $host: HTTP $status"
            done
            echo "Waiting... (attempt $i/60)"
            sleep 5
          done
          echo "IRIS did not become ready in 7 minutes"
          echo "=== Full container logs ==="
          docker logs iris-e2e 2>&1 | tail -80
          exit 1
      - name: Detect and set IRIS credentials
        run: |
          HOST=${{ env.IRIS_HOST }}
          # IRIS 2025+ community images use SuperUser/SYS for Atelier REST
          for user_pass in "_SYSTEM:SYS" "SuperUser:SYS" "_SYSTEM:sys" "SuperUser:sys"; do
            user="${user_pass%%:*}"
            pass="${user_pass##*:}"
            status=$(curl -s -o /dev/null -w "%{http_code}" -u "$user:$pass" "http://$HOST:52773/api/atelier/" 2>/dev/null)
            if [ "$status" = "200" ]; then
              echo "IRIS_USERNAME=$user" >> "$GITHUB_ENV"
              echo "IRIS_PASSWORD=$pass" >> "$GITHUB_ENV"
              echo "Using credentials: $user (HTTP $status)"
              exit 0
            fi
            echo "  $user:$pass — HTTP $status"
          done
          echo "WARNING: Could not authenticate with any known credentials"
          echo "IRIS_USERNAME=_SYSTEM" >> "$GITHUB_ENV"
          echo "IRIS_PASSWORD=SYS" >> "$GITHUB_ENV"
      - name: Create UnitTest directories in IRIS container
        run: |
          # iris_test uses RunTest which needs pre-existing directories with .cls files
          # RunTest /load looks for .cls files in ^UnitTestRoot/PackageName/
          docker exec iris-e2e bash -c 'mkdir -p /tmp/httest/IrisDevRunTest'
          # Write class file using printf to avoid YAML/heredoc quoting issues
          docker exec iris-e2e bash -c 'printf "Class IrisDevRunTest.UnitTestSuite Extends %%UnitTest.TestCase {\nMethod TestAlwaysPasses() { Do \$\$\$AssertEquals(1,1) }\nMethod TestAlwaysFails() { Do \$\$\$AssertEquals(1,2) }\n}" > /tmp/httest/IrisDevRunTest/UnitTestSuite.cls'
          echo "Created /tmp/httest/IrisDevRunTest/UnitTestSuite.cls in iris-e2e container"
      - name: Run E2E tests against live IRIS (Rust)
        # `--include-ignored` is not optional here. The four `#[ignore]` tests in
        # test_sql_translate_e2e had never run in ANY job: the branch gate skips this
        # job, and this job named only `--test test_e2e`. They reported as "ignored",
        # which reads as coverage and is the absence of it — #177 shipped through four
        # releases underneath them.
        #
        # #240: that remedy reached ONE of the seven targets carrying `#[ignore]` tests.
        # The other six — interop_e2e_tests, admin_e2e_tests,
        # progressive_disclosure_integration, test_live_reload_e2e, test_sql_safety_e2e,
        # test_iris_test_e2e — ran in NO job at all, 44 tests' worth, and reported as
        # "ignored" beside a target that was genuinely covered, which made them look MORE
        # trustworthy than they were.
        #
        # So this no longer names targets. It derives them from `cargo metadata`, exactly as
        # the required gate does, and runs the same list with `--include-ignored`. A new test
        # target, or a new `#[ignore]` test in an existing one, is therefore covered by
        # default — nobody has to remember to add it here. That is the #95 argument applied
        # to the job that had quietly become the hand-kept list #95 removed from the gate.
        run: |
          TARGETS=$(bash scripts/ci-test-targets.sh)
          # Same refusal as the required gate: never run a degraded list silently.
          if [[ "$TARGETS" != *--test* ]]; then
            echo "::error::scripts/ci-test-targets.sh emitted no test targets - refusing to run a degraded e2e job"
            exit 1
          fi
          # Unquoted on purpose: $TARGETS must word-split into the --test flags.
          # That word-splitting is the point, not an oversight:
          # shellcheck disable=SC2086
          cargo test --workspace --lib --bins $TARGETS --no-fail-fast -- --include-ignored --nocapture
        env:
          IRIS_HOST: ${{ env.IRIS_HOST }}
          IRIS_WEB_PORT: "52773"
          IRIS_USERNAME: ${{ env.IRIS_USERNAME }}
          IRIS_PASSWORD: ${{ env.IRIS_PASSWORD }}
          IRIS_NAMESPACE: USER
          IRIS_CONTAINER: iris-e2e
          # discover_via_docker_named_finds_running_container is the live guard for the bollard 0.21
          # migration (#23): it asserts a running container named by this variable does not come back
          # NotFound. The variable was set in NO workflow, so the test returned early and reported
          # `... ok` -- measured in run 35502654196, where the test line and its own
          # "Skipping: IRIS_DISCOVERY_TEST_CONTAINER not set" both appear. That is worse than
          # `#[ignore]`: an ignored test is visibly not coverage, while `ok` reads as coverage. #240
          # fixed the case where ignored tests ran in no job; this is the same failure one level in,
          # where the test runs and self-skips.
          #
          # This job already has a running container named iris-e2e, which is exactly the input the
          # test wants, so point it there and the guard finally executes.
          IRIS_DISCOVERY_TEST_CONTAINER: iris-e2e

  cross-compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-zigbuild
      - run: cargo zigbuild --release --target x86_64-unknown-linux-musl -p iris-agentic-dev
      - run: file target/x86_64-unknown-linux-musl/release/iris-interop-dev
      # #174: this used to `echo` on BOTH branches and exit 0 either way — a check that
      # could not fail in the way the thing actually fails. It is an assertion now.
      - name: "SC-002: musl build is statically linked"
        run: |
          out=$(ldd target/x86_64-unknown-linux-musl/release/iris-interop-dev 2>&1 || true)
          echo "$out"
          if ! grep -q "not a dynamic executable\|statically linked" <<<"$out"; then
            echo "::error::musl build acquired a dynamic dependency — it is no longer portable"
            exit 1
          fi
          echo "SC-002 PASS: static binary confirmed"

# (workflow registered under intersystems-ib/iris-interop-dev)
